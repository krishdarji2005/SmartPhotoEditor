<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Photo Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            color: #1e293b;
        }

        .header {
            background: #ffffff;
            padding: 16px 24px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-header {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-header {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
            font-size: 0.875rem;
        }

        .btn-home {
            background: transparent;
            color: #64748b;
            border: 1px solid #e2e8f0;
        }

        .btn-home:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        .btn-download {
            background: #1e293b;
            color: white;
        }

        .btn-download:hover {
            background: #334155;
        }

        .btn-download:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

        .main-container {
            display: flex;
            height: calc(100vh - 65px);
        }

        .sidebar {
            width: 280px;
            background: #ffffff;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #e2e8f0;
        }

        .sidebar-section {
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .filter-btn {
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            font-size: 0.8rem;
        }

        .filter-btn:hover {
            border-color: #94a3b8;
            background: #f8fafc;
        }

        .filter-btn.active {
            background: #1e293b;
            color: white;
            border-color: #1e293b;
        }

        .slider-control {
            margin-bottom: 16px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.8rem;
            color: #64748b;
        }

        .slider {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #e2e8f0;
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #1e293b;
            cursor: pointer;
        }

        .slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #1e293b;
            cursor: pointer;
            border: none;
        }

        .enhancement-btn {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            border: none;
            border-radius: 6px;
            background: white;
            color: #1e293b;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
            border: 1px solid #e2e8f0;
            text-align: left;
            font-size: 0.85rem;
        }

        .enhancement-btn:hover:not(:disabled) {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        .enhancement-btn:disabled {
            background: #f1f5f9;
            color: #94a3b8;
            cursor: not-allowed;
            border-color: #e2e8f0;
        }

        .reset-btn {
            background: white;
            color: #dc2626;
            border-color: #fecaca;
        }

        .reset-btn:hover:not(:disabled) {
            background: #fef2f2;
            border-color: #dc2626;
        }

        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            background: #f8fafc;
        }

        .upload-zone {
            width: 100%;
            max-width: 500px;
            height: 300px;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upload-zone:hover {
            border-color: #94a3b8;
            background: #f8fafc;
        }

        .upload-zone.dragover {
            border-color: #1e293b;
            background: #f1f5f9;
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 16px;
            color: #64748b;
        }

        .upload-text {
            color: #1e293b;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .upload-subtext {
            color: #64748b;
            font-size: 0.85rem;
        }

        .image-display {
            max-width: 90%;
            max-height: 80vh;
            display: none;
        }

        .image-display img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .loading.active {
            display: flex;
        }

        .loading-content {
            background: white;
            padding: 32px 48px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .spinner {
            border: 3px solid #f1f5f9;
            border-top: 3px solid #1e293b;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        input[type="file"] {
            display: none;
        }

        .comparison-container {
            display: none;
            max-width: 90%;
            max-height: 80vh;
            position: relative;
        }

        .comparison-images {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .comparison-images img {
            max-width: 45%;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .image-label {
            position: absolute;
            top: 16px;
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .label-before {
            left: 16px;
        }

        .label-after {
            right: 16px;
        }

        .status-message {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            background: #059669;
            color: white;
            border-radius: 6px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: none;
            z-index: 100;
            animation: slideIn 0.3s ease;
            font-size: 0.875rem;
        }

        .status-message.error {
            background: #dc2626;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                max-height: 300px;
            }
            .filter-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-header">
            <span>🎨</span>
            Smart Photo Editor
        </div>
        <div class="header-buttons">
            <button class="btn-header btn-home" onclick="window.location.href='/'">← Home</button>
            <button class="btn-header btn-download" id="downloadBtn" disabled>Download</button>
        </div>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <div class="sidebar-section">
                <div class="section-title">🎨 Filters</div>
                <div class="filter-grid">
                    <button class="filter-btn active" data-filter="original">Original</button>
                    <button class="filter-btn" data-filter="negative">Negative</button>
                    <button class="filter-btn" data-filter="vintage">Vintage</button>
                    <button class="filter-btn" data-filter="cool">Cool</button>
                    <button class="filter-btn" data-filter="warm">Warm</button>
                    <button class="filter-btn" data-filter="threshold">Threshold</button>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="section-title">⚙️ Adjustments</div>
                <div class="slider-control">
                    <div class="slider-label">
                        <span>Brightness</span>
                        <span id="brightnessValue">0</span>
                    </div>
                    <input type="range" class="slider" id="brightnessSlider" min="-100" max="100" value="0">
                </div>
                <div class="slider-control">
                    <div class="slider-label">
                        <span>Contrast</span>
                        <span id="contrastValue">1.0</span>
                    </div>
                    <input type="range" class="slider" id="contrastSlider" min="0.5" max="3" step="0.1" value="1">
                </div>
                <div class="slider-control">
                    <div class="slider-label">
                        <span>Gamma</span>
                        <span id="gammaValue">1.0</span>
                    </div>
                    <input type="range" class="slider" id="gammaSlider" min="0.1" max="3" step="0.1" value="1">
                </div>
                <button class="enhancement-btn" id="applyAdjustments" disabled>Apply Adjustments</button>
            </div>

            <div class="sidebar-section">
                <div class="section-title">✨ Enhancement</div>
                <button class="enhancement-btn" id="histogramBtn" disabled>Histogram Equalization</button>
                <button class="enhancement-btn" id="sharpenBtn" disabled>Sharpen Image</button>
                <button class="enhancement-btn" id="blurBtn" disabled>Blur Image</button>
                <button class="enhancement-btn" id="edgeBtn" disabled>Edge Detection</button>
                <button class="enhancement-btn reset-btn" id="resetBtn" disabled>Reset All</button>
            </div>

            <div class="sidebar-section">
                <div class="section-title">👁️ Comparison</div>
                <button class="enhancement-btn" id="compareBtn" disabled>Before/After View</button>
            </div>
        </div>

        <div class="canvas-area">
            <div class="upload-zone" id="uploadZone">
                <div class="upload-icon">📸</div>
                <div class="upload-text">Click or Drag to Upload</div>
                <div class="upload-subtext">Supports JPG, PNG, JPEG</div>
                <input type="file" id="fileInput" accept="image/*">
            </div>
            
            <div class="image-display" id="imageDisplay">
                <img id="displayImg" src="" alt="Processed Image">
            </div>

            <div class="comparison-container" id="comparisonContainer">
                <div class="comparison-images">
                    <div style="position: relative;">
                        <img id="beforeImg" src="" alt="Before">
                        <div class="image-label label-before">BEFORE</div>
                    </div>
                    <div style="position: relative;">
                        <img id="afterImg" src="" alt="After">
                        <div class="image-label label-after">AFTER</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="loading-content">
            <div class="spinner"></div>
            <div style="font-size: 1rem; font-weight: 600; color: #1e293b;">Processing Image...</div>
            <div style="margin-top: 8px; color: #64748b; font-size: 0.875rem;">Using Python OpenCV</div>
        </div>
    </div>

    <div class="status-message" id="statusMessage"></div>

    <script>
       let originalImageData = null;
        let currentImageData = null;
        const API_BASE = '';  // Empty for same origin

        // UI Elements
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const imageDisplay = document.getElementById('imageDisplay');
        const displayImg = document.getElementById('displayImg');
        const loading = document.getElementById('loading');

        // Upload handling
        uploadZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) loadImage(file);
        });

        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) loadImage(file);
        });

        function loadImage(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                originalImageData = e.target.result;
                currentImageData = e.target.result;
                displayImg.src = e.target.result;
                
                uploadZone.style.display = 'none';
                imageDisplay.style.display = 'block';
                
                enableButtons();
                showStatus('Image loaded successfully!');
            };
            reader.readAsDataURL(file);
        }

        function enableButtons() {
            document.querySelectorAll('.enhancement-btn, .filter-btn').forEach(btn => {
                btn.disabled = false;
            });
            document.getElementById('downloadBtn').disabled = false;
        }

        function showLoading() {
            loading.classList.add('active');
        }

        function hideLoading() {
            loading.classList.remove('active');
        }

        function showStatus(message, isError = false) {
            const statusMsg = document.getElementById('statusMessage');
            statusMsg.textContent = message;
            statusMsg.className = 'status-message' + (isError ? ' error' : '');
            statusMsg.style.display = 'block';
            
            setTimeout(() => {
                statusMsg.style.display = 'none';
            }, 3000);
        }

        async function sendToBackend(endpoint, additionalData = {}) {
            if (!currentImageData) return;

            showLoading();
            
            try {
                const response = await fetch(`/api/${endpoint}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        image: currentImageData,
                        ...additionalData
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    currentImageData = data.image;
                    displayImg.src = data.image;
                    showStatus(`${endpoint.replace('_', ' ')} applied successfully!`);
                } else {
                    showStatus('Error: ' + data.error, true);
                }
            } catch (error) {
                showStatus('Connection error! Make sure Flask server is running.', true);
                console.error('Error:', error);
            } finally {
                hideLoading();
            }
        }

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const filter = btn.dataset.filter;
                
                if (filter === 'original') {
                    currentImageData = originalImageData;
                    displayImg.src = originalImageData;
                    showStatus('Reset to original');
                } else {
                    await sendToBackend(filter + '_filter');
                }
            });
        });

        // Adjustment sliders
        const brightnessSlider = document.getElementById('brightnessSlider');
        const contrastSlider = document.getElementById('contrastSlider');
        const gammaSlider = document.getElementById('gammaSlider');

        brightnessSlider.addEventListener('input', (e) => {
            document.getElementById('brightnessValue').textContent = e.target.value;
        });

        contrastSlider.addEventListener('input', (e) => {
            document.getElementById('contrastValue').textContent = e.target.value;
        });

        gammaSlider.addEventListener('input', (e) => {
            document.getElementById('gammaValue').textContent = e.target.value;
        });

        document.getElementById('applyAdjustments').addEventListener('click', async () => {
            const brightness = parseInt(brightnessSlider.value);
            const contrast = parseFloat(contrastSlider.value);
            const gamma = parseFloat(gammaSlider.value);
            
            await sendToBackend('brightness_contrast', { brightness, contrast });
            
            if (gamma !== 1.0) {
                await sendToBackend('gamma_correction', { gamma });
            }
        });

        // Enhancement buttons
        document.getElementById('histogramBtn').addEventListener('click', () => {
            sendToBackend('histogram_equalization');
        });

        document.getElementById('sharpenBtn').addEventListener('click', () => {
            sendToBackend('sharpen');
        });

        document.getElementById('blurBtn').addEventListener('click', () => {
            sendToBackend('blur', { kernel_size: 9 });
        });

        document.getElementById('edgeBtn').addEventListener('click', () => {
            sendToBackend('edge_detection');
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            currentImageData = originalImageData;
            displayImg.src = originalImageData;
            
            brightnessSlider.value = 0;
            contrastSlider.value = 1;
            gammaSlider.value = 1;
            document.getElementById('brightnessValue').textContent = '0';
            document.getElementById('contrastValue').textContent = '1.0';
            document.getElementById('gammaValue').textContent = '1.0';
            
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('[data-filter="original"]').classList.add('active');
            
            showStatus('Reset to original image');
        });

        // Comparison
        document.getElementById('compareBtn').addEventListener('click', () => {
            document.getElementById('beforeImg').src = originalImageData;
            document.getElementById('afterImg').src = currentImageData;
            
            imageDisplay.style.display = 'none';
            document.getElementById('comparisonContainer').style.display = 'block';
        });

        // Close comparison on ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.getElementById('comparisonContainer').style.display = 'none';
                imageDisplay.style.display = 'block';
            }
        });

        // Download
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'edited-image.png';
            link.href = currentImageData;
            link.click();
            showStatus('Image downloaded!');
        });
    </script>
</body>
</html>
